name: Android APK

on:
  push:
    branches: [ "main", "feature/chatgpt-free-bridge", "feature/agentic-brain-android-v050" ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare stable test signing key
        shell: bash
        run: |
          base64 --decode ci/hamisheyar-debug.keystore.b64 > app/hamisheyar-debug.keystore
          chmod 600 app/hamisheyar-debug.keystore

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/hamisheyar-badging.txt
          grep -q "package: name='ir.hamisheyar.app'" /tmp/hamisheyar-badging.txt
          grep -q "versionCode='7'" /tmp/hamisheyar-badging.txt
          grep -q "versionName='0.5.0'" /tmp/hamisheyar-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamisheyar-0.5.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK as GitHub pre-release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Hamisheyar-0.5.0-agentic-test.apk
          TAG="v0.5.0-agentic-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Hamisheyar-0.5.0-agentic-test.apk --clobber
          else
            gh release create "$TAG" Hamisheyar-0.5.0-agentic-test.apk --target "$GITHUB_SHA" --title "Hamisheyar 0.5.0 Agentic Test" --notes "Android test APK. Gemini and Groq BYOK are both required. No Hamisheyar server. Not production-signed; device validation still required." --prerelease
          fi
