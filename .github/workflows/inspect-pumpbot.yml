name: Inspect Pump Hunter ZIP

on:
  push:
    branches: [ "inspect-pumpbot-zip" ]
    paths:
      - ".github/workflows/inspect-pumpbot.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print engine lifecycle and settings
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pumpbot && mkdir -p /tmp/pumpbot
          unzip -q Developersia-Pump-Hunter-v1.0.0.zip -d /tmp/pumpbot
          echo "===== engine.php 275-430 ====="
          nl -ba /tmp/pumpbot/pumpbot/app/engine.php | sed -n '275,430p'
          echo "===== settings.php ====="
          nl -ba /tmp/pumpbot/pumpbot/settings.php | sed -n '1,280p'
          echo "===== common.php 110-135 ====="
          nl -ba /tmp/pumpbot/pumpbot/app/common.php | sed -n '110,135p'
          echo "===== storage defaults and install ====="
          grep -n -C 3 -E 'storage|state.json|trades.jsonl|daily.json|initial_toman|telegram_' /tmp/pumpbot/pumpbot/install.php
